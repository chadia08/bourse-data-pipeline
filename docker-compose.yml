version: "3.9"

networks:
  bourse_network:
    driver: bridge

volumes:
  zookeeper_data:
  kafka_data:
  nifi_data:
  clickhouse_data:
  marquez_db:
  mongo_data:

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: zookeeper
    hostname: zookeeper
    networks:
      - bourse_network
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka
    hostname: kafka
    depends_on:
      - zookeeper
    networks:
      - bourse_network
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_OPTS: "-Datlas.conf=/etc/kafka/config"
      KAFKA_CLASSPATH: "/usr/share/java/kafka/*"
      ATLAS_CLUSTER_NAME: "bourse_cluster"
    volumes:
      - kafka_data:/var/lib/kafka/data
      - ./atlas-application.properties:/etc/kafka/config/atlas-application.properties

  nifi:
    image: 'apache/nifi:1.20.0'
    container_name: nifi
    hostname: nifi
    depends_on:
      - kafka

    networks:
      - bourse_network
    ports:
      - "8443:8443"
    environment:
      - SINGLE_USER_CREDENTIALS_USERNAME=admin
      - SINGLE_USER_CREDENTIALS_PASSWORD=Admin123456!
      - NIFI_WEB_HTTPS_PORT=8443
      - NIFI_WEB_HTTPS_HOST=0.0.0.0
      - NIFI_WEB_PROXY_HOST=192.168.10.129:8443
    restart: on-failure
    volumes:
      - ./Data/Raw:/data
      - ./nifi/database_repository:/opt/nifi/nifi-current/database_repository
      - ./nifi/flowfile_repository:/opt/nifi/nifi-current/flowfile_repository
      - ./nifi/content_repository:/opt/nifi/nifi-current/content_repository
      - ./nifi/provenance_repository:/opt/nifi/nifi-current/provenance_repository
      - ./nifi/state:/opt/nifi/nifi-current/state
      - ./nifi/logs:/opt/nifi/nifi-current/logs
      - ./nifi/custom_lib:/opt/nifi/nifi-current/extensions
      # - ./nifi/conf:/opt/nifi/nifi-current/conf
    
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: clickhouse
    hostname: clickhouse
    networks:
      - bourse_network
    ports:
      - "8123:8123" # Port HTTP (Le plus stable pour NiFi)
      - "9000:9000" # Port Natif (Pour les clients CLI)
    environment:
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=admin
      - CLICKHOUSE_DB=bourse
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  
  
  # Base de données pour Marquez
  marquez-db:
    image: postgres:13
    container_name: marquez-db
    environment:
      POSTGRES_USER: marquez
      POSTGRES_PASSWORD: marquez
      POSTGRES_DB: marquez
    ports:
      - "5432:5432"
    volumes:
      - marquez_db:/var/lib/postgresql/data
    networks:
      - bourse_network

  marquez:
    image: marquezproject/marquez:latest
    container_name: marquez
    depends_on:
      - marquez-db
    environment:
      POSTGRES_HOST: marquez-db
      POSTGRES_PORT: 5432
      POSTGRES_DB: marquez
      POSTGRES_USER: marquez
      POSTGRES_PASSWORD: marquez
      MARQUEZ_PORT: 5002
    ports:
      - "5002:5002"
    networks:
      - bourse_network

  marquez-web:
    image: marquezproject/marquez-web:latest
    container_name: marquez-web
    depends_on:
      - marquez
    environment:
      MARQUEZ_HOST: marquez
      MARQUEZ_PORT: 5002
      WEB_PORT: 3000
    ports:
      - "3000:3000"
    networks:
      - bourse_network



