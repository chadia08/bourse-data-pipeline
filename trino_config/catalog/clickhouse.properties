# Dit à Trino d'utiliser le pilote pour ClickHouse
connector.name=clickhouse

# L'adresse pour trouver ClickHouse dans Docker
# 'clickhouse' doit être le nom du service dans ton docker-compose
connection-url=jdbc:clickhouse://clickhouse:8123/bourse?compress=0

# Tes identifiants ClickHouse
connection-user=default
connection-password=admin

clickhouse.map-string-as-varchar=true   

